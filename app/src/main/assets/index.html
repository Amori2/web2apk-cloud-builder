<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
(function(){
  window.addEventListener('error',function(e){console.warn('WV-Shield:',e.message);});
  window.addEventListener('unhandledrejection',function(e){console.warn('WV-Shield:',e.reason);});
  if(typeof window.Notification==='undefined'){
    window.Notification=function(){};
    window.Notification.permission='granted';
    window.Notification.requestPermission=function(cb){if(cb)cb('granted');return Promise.resolve('granted');};
  }
  if(!('serviceWorker' in navigator)||location.protocol==='file:'){
    try{Object.defineProperty(navigator,'serviceWorker',{value:{register:function(){return Promise.resolve({});},ready:Promise.resolve({}),getRegistrations:function(){return Promise.resolve([]);},addEventListener:function(){}},configurable:true});}catch(e){}
  }
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){
    var m={};var s={getItem:function(k){return m.hasOwnProperty(k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};}};
    try{Object.defineProperty(window,'localStorage',{value:s});Object.defineProperty(window,'sessionStorage',{value:s});}catch(err){}
  }
  var op=history.pushState,or=history.replaceState;
  history.pushState=function(s,t,u){try{return op.apply(this,arguments);}catch(e){}};
  history.replaceState=function(s,t,u){try{return or.apply(this,arguments);}catch(e){}};
  if(!navigator.clipboard)navigator.clipboard={};
  if(!navigator.clipboard.writeText){
    navigator.clipboard.writeText=function(t){return new Promise(function(res){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);res();});};
  }
  
  document.addEventListener('DOMContentLoaded', function() {
    var sp = document.createElement('div');
    sp.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;transition:opacity 0.4s ease;';
    sp.innerHTML = '<div style="width:56px;height:56px;border:4px solid #34d399;border-top-color:transparent;border-radius:50%;animation:w2aspin 0.8s linear infinite;margin-bottom:16px;"></div><div style="font-size:18px;font-weight:bold;">تطبيقي الاحترافي</div><style>@keyframes w2aspin{to{transform:rotate(360deg)}}</style>';
    document.body.appendChild(sp);
    setTimeout(function(){ sp.style.opacity='0'; setTimeout(function(){ sp.remove(); }, 400); }, 1200);
  });
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق احترافي</title>
  <style>
    body { font-family: sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-top: 16px; }
    button { background: #10b981; color: #052e16; border: none; padding: 12px 18px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>لوحة التحكم الذكية</h2>
  <div class="box">
    <p id="statusTxt">اضغط على الأزرار لاختبار عمل الجافاسكربت والصلاحيات</p>
    <button onclick="testAction()">تنفيذ إجراء فوري (+1)</button>
    <button onclick="testGeo()" style="background:#38bdf8">اختبار صلاحية الموقع GPS</button>
  </div>
  <script>
    let counter = 0;
    function testAction() {
      counter++;
      document.getElementById('statusTxt').innerText = 'تم الضغط بنجاح: ' + counter + ' مرة';
    }
    function testGeo() {
      if (!navigator.geolocation) { alert('غير مدعوم'); return; }
      navigator.geolocation.getCurrentPosition(
        pos => alert('تم جلب الإحداثيات: ' + pos.coords.latitude.toFixed(4)),
        err => alert('تنبيه الموقع: ' + err.message)
      );
    }
  </script>
</body>
</html>
